name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests and Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/web-app/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r apps/web-app/requirements.txt -r apps/web-app/requirements-dev.txt

      - name: Lint with Ruff
        working-directory: apps/web-app
        run: ruff check .

      - name: Run automated tests
        working-directory: apps/web-app
        run: pytest -q --junitxml=../../pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker image can be built
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web-app
          push: false
          tags: web-deployment-platform:test
          cache-from: type=gha

  publish-image:
    name: Publish image to GitHub Container Registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-name.outputs.image }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Create lowercase image name
        id: image-name
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web-app
          push: true
          tags: |
            ${{ steps.image-name.outputs.image }}:${{ github.sha }}
            ${{ steps.image-name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Linux server via SSH
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ needs.publish-image.outputs.image }}
      IMAGE_TAG: ${{ github.sha }}
      APP_PORT: ${{ vars.APP_PORT || '8080' }}
      GHCR_USER: ${{ secrets.GHCR_USER }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Deploy new version and verify health
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          APP_PORT: ${{ env.APP_PORT }}
          GHCR_USER: ${{ env.GHCR_USER }}
          GHCR_TOKEN: ${{ env.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: IMAGE_NAME,IMAGE_TAG,APP_PORT,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            APP_DIR="$HOME/web-deployment-platform"
            mkdir -p "$APP_DIR"

            if [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
            fi

            cat > "$APP_DIR/compose.yml" <<EOF
            services:
              web:
                image: ${IMAGE_NAME}:${IMAGE_TAG}
                restart: unless-stopped
                ports:
                  - "${APP_PORT}:8000"
                healthcheck:
                  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
                  interval: 15s
                  timeout: 5s
                  retries: 3
                  start_period: 10s
            EOF

            docker pull "${IMAGE_NAME}:${IMAGE_TAG}"
            docker compose -f "$APP_DIR/compose.yml" up -d --remove-orphans

            for attempt in $(seq 1 15); do
              if curl --fail --silent "http://127.0.0.1:${APP_PORT}/health"; then
                echo "Deployment verified successfully."
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed after deployment." >&2
            docker compose -f "$APP_DIR/compose.yml" logs --tail=100 web
            exit 1
